version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: experiment
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor:
        update-types: [minor, patch]
    ignore:
      # Two majors that upstream cannot take yet. Without these rules Dependabot reopens the same
      # pull request every week and it gets closed every week, which trains everyone to ignore it.
      # Remove the entry — do not just bump it — once the blocker below is gone.
      #
      # TypeScript 6 is applied, with `ignoreDeprecations: "6.0"` in apps/docs/tsconfig.json —
      # @docusaurus/tsconfig (3.10.2) still sets `baseUrl`, which 6 makes an error and 7 removes
      # outright. At 7 the flag stops helping, so the hold stays until Docusaurus ships a tsconfig
      # without it. npm hoists one typescript across the workspace, so holding it for the docs
      # holds it for the landing too.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # eslint-plugin-react, which arrives through eslint-config-next, declares peer eslint
      # "^3 || ... || ^9.7" — ESLint 10 is not in that range and the plugin throws on its rule API.
      - dependency-name: "eslint"
        versions: ["10.x"]

  - package-ecosystem: gradle
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    target-branch: experiment
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: experiment
    commit-message:
      prefix: "ci(deps)"
