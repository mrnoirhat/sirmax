# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security

on:
  push:
    branches: [experiment, testing, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly (MIT). The gitleaks-action wrapper gates
      # on GITLEAKS_LICENSE for some accounts; the binary does not.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "gitleaks v$VERSION"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner --exit-code 1

  npm-audit:
    name: npm audit (web workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit (high severity, non-blocking until Phase 10)
        run: npm audit --audit-level=high || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      - if: matrix.language == 'java-kotlin'
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - if: matrix.language == 'java-kotlin'
        name: Build Java for analysis
        working-directory: apps/desktop
        run: ./gradlew --no-daemon compileJava

      - name: Analyze
        uses: github/codeql-action/analyze@v3
