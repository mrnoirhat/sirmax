# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security

on:
  push:
    branches: [experiment, testing, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly (MIT). The gitleaks-action wrapper gates
      # on GITLEAKS_LICENSE for some accounts; the binary does not.
      # Version is pinned (no GitHub API call at job time — the unauthenticated
      # /releases/latest endpoint is rate-limited on shared runners). Bump
      # deliberately.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$url" | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner --exit-code 1

  npm-audit:
    name: npm audit (web workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit (high severity, non-blocking until Phase 10)
        run: npm audit --audit-level=high || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      - if: matrix.language == 'java-kotlin'
        name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: matrix.language == 'java-kotlin'
        name: Build Java for analysis
        working-directory: apps/desktop
        # CodeQL's tracer must observe real javac runs. The project sets
        # org.gradle.caching=true, so a warm Gradle build cache would unpack
        # .class files without compiling and CodeQL fails with "didn't build
        # any code" (exit 32). Force actual compilation here.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks compileJava

      - name: Analyze
        uses: github/codeql-action/analyze@v3
