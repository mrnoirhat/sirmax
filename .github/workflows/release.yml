# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Fires on a version tag. Building the release from the tag rather than from a
# developer's machine is what makes the artifact reproducible: whatever is
# downloaded corresponds exactly to the commit the tag names.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write # creating the release and uploading its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash # so ./gradlew (not .bat) resolves on the Windows runner
    env:
      # Job-level, not step-level: a step's own `env:` is not in scope for that step's `if:`,
      # which is evaluated first. Empty until the SignPath application is approved.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image ships WiX 3.14 but does not put it on PATH, and
      # jpackage looks for candle/light there. Without this the MSI is silently
      # skipped and the release goes out with only the portable archive.
      - name: Put WiX on PATH
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX is not installed on this runner image' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "WiX: $($wix.FullName)"

      - name: Verify before packaging
        run: ./gradlew --no-daemon build

      # verifyReleaseArtifacts fails if the bundled runtime did not make it in,
      # so a release cannot ship an artifact that installs and then will not start.
      - name: Package and verify
        run: ./gradlew --no-daemon verifyReleaseArtifacts

      - name: Upload unsigned artifacts for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: sirmax-unsigned
          path: apps/desktop/sirmax-app/build/installer/
          if-no-files-found: error

      # SignPath Foundation signs the artifacts with its own certificate, held in an HSM the
      # project never has access to. Gated on the secret so the release still builds and publishes
      # before the application is approved — an unsigned release is worse than a signed one, but a
      # release that cannot be cut at all is worse than both.
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sirmax
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/sirmax-app/build/installer

      # Checksums are computed *after* signing: a signature rewrites the file, so a hash taken
      # before it would never match what anyone downloads.
      - name: Checksums
        shell: pwsh
        working-directory: apps/desktop/sirmax-app/build/installer
        run: |
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sirmax-release-artifacts
          path: apps/desktop/sirmax-app/build/installer/
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: sirmax-release-artifacts
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SIRMAX ${{ inputs.tag || github.ref_name }}
          # The tag's own annotation is the release notes: written once, at the
          # moment of tagging, rather than restated here where it could drift.
          generate_release_notes: false
          body_path: .github/release-body.md
          files: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
