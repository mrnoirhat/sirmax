# SPDX-License-Identifier: AGPL-3.0-or-later
name: Desktop

on:
  push:
    branches: [experiment, testing, main]
    paths:
      - "apps/desktop/**"
      - "database/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "database/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 25)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      # The wrapper jar is not committed yet (see gradle/wrapper/README.md);
      # generate it so `./gradlew` works for downstream steps and contributors.
      - name: Ensure Gradle wrapper
        run: gradle wrapper --gradle-version 8.12

      - name: Build, test and static analysis
        run: gradle --no-daemon build

      - name: Packaging smoke test (jar assembly)
        run: gradle --no-daemon :sirmax-app:assemble

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: apps/desktop/**/build/reports/
          if-no-files-found: ignore
