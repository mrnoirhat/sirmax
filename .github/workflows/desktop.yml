# SPDX-License-Identifier: AGPL-3.0-or-later
name: Desktop

on:
  push:
    branches: [experiment, testing, main]
    paths:
      - "apps/desktop/**"
      - "database/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "database/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 25)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash # so ./gradlew (not .bat) resolves on the Windows runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and static analysis
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: apps/desktop/**/build/reports/
          if-no-files-found: ignore

  package:
    name: Package (Windows app image)
    # Only on the permanent branches: packaging takes minutes and adds nothing
    # to a pull request that the build job has not already proved.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: build
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # WiX is not on the GitHub runner and the MSI needs it. The app image does
      # not, so this proves the part that can be proved on every push: a trimmed
      # runtime is built, jpackage bundles it, and the result is a real artifact.
      # The MSI is produced by the release job on a machine with WiX (§67).
      - name: Build and verify the packaged app image
        run: ./gradlew --no-daemon verifyReleaseArtifacts

      - name: Upload the app image
        uses: actions/upload-artifact@v4
        with:
          name: sirmax-app-image
          path: apps/desktop/sirmax-app/build/app-image/
          if-no-files-found: error
          retention-days: 14
