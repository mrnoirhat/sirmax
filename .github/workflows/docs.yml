name: Docs

on:
  push:
    branches: [experiment, testing, main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace apps/docs

      # Docusaurus is configured with onBrokenLinks: "throw", so a broken
      # internal link fails this step.
      - name: Build (fails on broken links)
        run: npm run build --workspace apps/docs

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: apps/docs/build
          if-no-files-found: error

      # Turns Pages on for the repository if nobody has yet. Without this the
      # deploy job fails with "Get Pages site failed" on a repository that has
      # never published, which is every repository the first time — a red build
      # caused by a setting rather than by the code.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The Pages artifact is only produced from main: documentation and the
      # released application have to say the same thing (§67), and experiment
      # says whatever is being tried out this week.
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
