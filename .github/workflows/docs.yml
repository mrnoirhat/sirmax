# SPDX-License-Identifier: AGPL-3.0-or-later
name: Docs

on:
  push:
    branches: [experiment, testing, main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace apps/docs

      # Docusaurus is configured with onBrokenLinks: "throw", so a broken
      # internal link fails this step.
      - name: Build (fails on broken links)
        run: npm run build --workspace apps/docs

      # The Pages mirror lives under /sirmax/, Vercel serves the same site at the
      # root of its own domain. Building it twice is cheaper than a wrong baseUrl,
      # which produces a site that loads and then 404s every asset.
      - name: Rebuild for the GitHub Pages mirror
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        env:
          DOCS_TARGET: github-pages
        run: npm run build --workspace apps/docs

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: apps/docs/build
          if-no-files-found: error

      # Publishing needs one manual step first, because enabling Pages is a
      # repository-administration action and GITHUB_TOKEN cannot do it:
      #
      #   1. Settings → Pages → Build and deployment → Source: GitHub Actions
      #   2. Settings → Secrets and variables → Actions → Variables:
      #      PUBLISH_DOCS = true
      #
      # Until then the docs are still built, typechecked and link-checked on
      # every push — the workflow just does not try to publish. A release build
      # going red because nobody has visited a settings page would say the code
      # is broken when it is not, and a red build that means nothing is a build
      # people stop reading.
      - name: Package for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
