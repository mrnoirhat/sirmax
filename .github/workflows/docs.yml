name: Docs

on:
  push:
    branches: [experiment, testing, main]
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # `cache: npm` is added together with package-lock.json (Phase 1 pending item).

      - name: Install dependencies
        # package-lock.json is not committed yet (Phase 1 pending item), so use
        # `npm install`. Switch to `npm ci` once the lockfile lands.
        run: npm install

      - name: Typecheck
        run: npm run typecheck --workspace apps/docs

      # Docusaurus is configured with onBrokenLinks: "throw", so a broken
      # internal link fails this step.
      - name: Build (fails on broken links)
        run: npm run build --workspace apps/docs

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: apps/docs/build
          if-no-files-found: error
